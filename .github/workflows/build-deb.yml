name: Build PaceChaser Debian Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install system build dependencies
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            fakeroot \
            dh-make \
            lintian \
            python3-all \
            python3-pip \
            python3-setuptools \
            python3-wheel

      # 4. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install -r requirements.txt

      # 5. Make main.py executable
      - name: Make main.py executable
        run: chmod +x main.py

      # 6. Build Debian package
      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b

      # 7. Run lintian (non-fatal)
      - name: Run lintian
        run: lintian ../*.deb || true

      # 8. Upload DEB artifact
      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacechaser-deb
          path: ../*.deb
